# Codemagic CI — builds the Kingston Mosque mobile apps (mobile/) in the cloud.
# iOS is built on Codemagic's Macs, so no Mac is needed locally.
#
# One-time setup in the Codemagic dashboard (https://codemagic.io):
#   1. Add this repository as an application ("Other" → codemagic.yaml).
#   2. iOS release: Teams → Integrations → App Store Connect → add an API key
#      named "kma-appstore" (Users & Access → Integrations in App Store Connect).
#      Codemagic then creates/fetches the signing certificate + profile itself.
#   3. Android release: create an upload keystore once
#        keytool -genkey -v -keystore kma.keystore -alias kma -keyalg RSA -keysize 2048 -validity 10000
#      and upload it under Teams → Code signing identities → Android, referenced
#      below as "kma_keystore".
#   4. The "android-preview" workflow needs NO credentials — run it first to get
#      an installable APK for testing on any Android phone. Every finished
#      build also EMAILS a tap-to-install link, so there's no cable/manual
#      APK copying: open the email on the phone, tap the .apk link, install.
#
# Android "like TestFlight" — Google Play internal testing (android-release):
#   Once set up, running android-release publishes straight to the Play Store's
#   internal-testing track and your phone updates through the Play Store —
#   the same flow as TestFlight on iOS. One-time setup:
#     a. Google Play Console account (play.google.com/console, one-off $25).
#     b. Create the app there: name "Kingston Masjid", package
#        org.kingstonmosque.app (must match mobile/app.json exactly).
#     c. Play Console → Users & permissions is NOT enough for CI: create a
#        Google Cloud SERVICE ACCOUNT (console.cloud.google.com → IAM →
#        Service accounts → create → add key → JSON), then in Play Console →
#        Setup → API access, link that Cloud project and grant the service
#        account "Release to testing tracks" permission.
#     d. Codemagic → your app → Environment variables: add
#        GCLOUD_SERVICE_ACCOUNT_CREDENTIALS = (paste the whole JSON file),
#        group "google_play", mark it Secure.
#     e. Google requires the VERY FIRST bundle to be uploaded by hand: run
#        android-release once, download the .aab artifact, and upload it in
#        Play Console → Testing → Internal testing → Create release. Add your
#        Google account as a tester there and open the opt-in link on your
#        phone once.
#     f. Every android-release build after that publishes automatically and
#        the phone updates from the Play Store. Done.

workflows:
  # ── Android test build — zero setup, installable .apk ─────────────────────
  android-preview:
    name: Android preview (APK, no signing setup)
    # mac_mini_m2 is the machine included in Codemagic's free plan (500 min/month);
    # Linux instances (linux_x2) need a paid billing plan. Android builds fine on macOS.
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      node: 20.18.1
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Set an ever-increasing versionCode
        script: |
          # Google Play refuses a duplicate versionCode; stamp it from the CI
          # build number (same pattern as the iOS CFBundleVersion step).
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.android.versionCode = parseInt(process.env.BUILD_NUMBER || String(Math.floor(Date.now()/1000)), 10);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
            console.log('versionCode =', j.expo.android.versionCode);
          "
      - name: Generate the native Android project
        script: npx expo prebuild --platform android --no-install
      - name: Build self-contained release APK
        script: |
          # MUST be assembleRelease, not assembleDebug: a debug APK contains no
          # JavaScript — it expects a Metro dev server on the developer's
          # machine, so on a real phone it hangs on the splash screen forever
          # (the JS that hides the splash never runs). The release variant
          # embeds the JS bundle, and Expo's generated build.gradle signs it
          # with the auto-created debug keystore, so it still needs zero
          # credentials and installs on any phone.
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Show where the APK actually is
        script: |
          # Prints every .apk Gradle produced with its absolute path so the
          # matcher globs below can't miss (and future debugging is easy).
          echo "CM_BUILD_DIR=$CM_BUILD_DIR  pwd=$(pwd)"
          find "$CM_BUILD_DIR" -name '*.apk' -print 2>/dev/null || true
          find "$CM_BUILD_DIR" -name '*.apk' -exec ls -la {} + 2>/dev/null || true
    artifacts:
      # The artifact matcher searches from CM_BUILD_DIR (the clone root),
      # regardless of the workflow's working_directory. A broad recursive
      # glob is more forgiving than the exact debug/*.apk path.
      - "**/*.apk"
    publishing:
      # Tap-to-install: the build email contains a direct link to the .apk —
      # open it ON the phone, tap, install. No cables, no manual copying.
      email:
        recipients:
          - barikzai@gmail.com
        notify:
          success: true
          failure: true

  # ── Android release — signed .aab for Google Play ─────────────────────────
  android-release:
    name: Android release (Google Play)
    # Same as android-preview: the free plan includes mac_mini_m2, not Linux.
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    environment:
      android_signing:
        - kma_keystore
      groups:
        # Must contain GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (the Google Cloud
        # service-account JSON with Play "Release to testing tracks" access) —
        # see the setup notes at the top of this file.
        - google_play
      node: 20.18.1
      java: 17
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Set an ever-increasing versionCode
        script: |
          # Google Play refuses a duplicate versionCode; stamp it from the CI
          # build number (same pattern as the iOS CFBundleVersion step).
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.android.versionCode = parseInt(process.env.BUILD_NUMBER || String(Math.floor(Date.now()/1000)), 10);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
            console.log('versionCode =', j.expo.android.versionCode);
          "
      - name: Generate the native Android project
        script: npx expo prebuild --platform android --no-install
      - name: Point Gradle at the CI keystore
        script: |
          # Fail LOUDLY if the kma_keystore signing identity isn't attached —
          # otherwise Gradle dies later with a confusing "unknown property".
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: CM_KEYSTORE_PATH is empty — the 'kma_keystore' Android keystore"
            echo "is not set up in Codemagic → Settings → Code signing identities."
            exit 1
          fi
          # Expo's generated gradle.properties has NO trailing newline, so a
          # plain append glues the first property onto the last existing line
          # (…hermesEnabled=trueMYAPP_UPLOAD_STORE_FILE=…) and Gradle then
          # reports "unknown property MYAPP_UPLOAD_STORE_FILE". Start with a
          # newline so every property lands on its own line.
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<EOF
          MYAPP_UPLOAD_STORE_FILE=$CM_KEYSTORE_PATH
          MYAPP_UPLOAD_STORE_PASSWORD=$CM_KEYSTORE_PASSWORD
          MYAPP_UPLOAD_KEY_ALIAS=$CM_KEY_ALIAS
          MYAPP_UPLOAD_KEY_PASSWORD=$CM_KEY_PASSWORD
          EOF
          echo "--- last lines of gradle.properties (values hidden) ---"
          tail -5 android/gradle.properties | sed 's/=.*/=***/'
          printf '\n' >> android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file(MYAPP_UPLOAD_STORE_FILE)
                      storePassword MYAPP_UPLOAD_STORE_PASSWORD
                      keyAlias MYAPP_UPLOAD_KEY_ALIAS
                      keyPassword MYAPP_UPLOAD_KEY_PASSWORD
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build release bundle
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease
      - name: Show where the AAB actually is
        script: |
          # Prints every .aab Gradle produced with its absolute path so the
          # matcher globs below can't miss (and future debugging is easy).
          echo "CM_BUILD_DIR=$CM_BUILD_DIR  pwd=$(pwd)"
          find "$CM_BUILD_DIR" -name '*.aab' -print 2>/dev/null || true
          find "$CM_BUILD_DIR" -name '*.aab' -exec ls -la {} + 2>/dev/null || true
    artifacts:
      # ONLY the final signed bundle — never Gradle's unsigned
      # build/intermediates/…/intermediary-bundle.aab (Codemagic publishes
      # every matched .aab to Google Play, and the unsigned one gets rejected
      # and fails the build). Both path bases are listed because the matcher
      # can resolve from the clone root OR the mobile/ working directory —
      # an unmatched pattern is silently skipped, so listing both is safe.
      # (A build that matched only mobile/… produced NO artifact and silently
      # skipped publishing — that's the failure mode being prevented here.)
      - android/app/build/outputs/bundle/release/*.aab
      - mobile/android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - barikzai@gmail.com
        notify:
          success: true
          failure: true
      # TestFlight-for-Android: push the signed bundle to the Play Store's
      # internal-testing track. Testers' phones then update through the Play
      # Store automatically. Remember: Google insists the FIRST-ever bundle is
      # uploaded by hand in the Play Console (step e in the header notes).
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        # Draft releases work before the app's store listing is complete;
        # switch to false once the app is fully set up in the Play Console so
        # each build goes straight out to internal testers.
        submit_as_draft: true

  # ── iOS release — signed .ipa for TestFlight / App Store ──────────────────
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: mobile
    integrations:
      app_store_connect: kma-appstore
    environment:
      # Signing via SAVED code signing identities (Codemagic → Personal
      # Account → Code signing identities). The Apple Distribution certificate
      # and the "Kingston Masjid App Store" provisioning profile are stored
      # there under these EXACT reference names. This pins the build to
      # known-good files instead of automatic portal matching, which kept
      # failing with "No matching profiles found" despite the profile
      # existing.
      ios_signing:
        certificates:
          - kma_distribution
        provisioning_profiles:
          - Kingston Masjid App Store
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Generate the native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Set an ever-increasing build number
        script: |
          # App Store Connect rejects an upload whose CFBundleVersion is not
          # higher than the last one. Codemagic's BUILD_NUMBER increments every
          # build, so use it (with an epoch fallback) as the bundle version.
          BN="${BUILD_NUMBER:-$(date +%s)}"
          PLIST=$(find ios -maxdepth 2 -name "Info.plist" -not -path "*Pods*" | head -1)
          echo "Setting CFBundleVersion=$BN in $PLIST"
          plutil -replace CFBundleVersion -string "$BN" "$PLIST"
      - name: Install CocoaPods
        script: |
          cd ios
          pod install
      - name: Apply provisioning profiles to the Xcode project
        script: xcode-project use-profiles
      - name: Build the .ipa
        script: |
          # Expo prebuild names the app scheme after the workspace. Deriving it
          # from the workspace filename avoids picking up Pod schemes (the
          # workspace's scheme list starts with libraries like "boost").
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace=$WORKSPACE scheme=$SCHEME"
          # On failure, surface the real xcodebuild error: build-ipa hides the
          # detailed compiler output in a log file under $TMPDIR.
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME" || {
            echo "===== xcodebuild error lines ====="
            grep -n "error:" "${TMPDIR:-/tmp}"/codemagic-*.log | head -40 || true
            echo "===== last 200 lines of the detailed xcodebuild log ====="
            tail -n 200 "${TMPDIR:-/tmp}"/codemagic-*.log || true
            exit 65
          }
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
